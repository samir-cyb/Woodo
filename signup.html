<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — Woodo</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
</head>
<body data-page="signup">

  <div class="auth-page">
    <div class="auth-visual">
      <img src="https://images.unsplash.com/photo-1513519245088-0e12902e35ca?w=800&h=1200&fit=crop" alt="Art Studio">
      <div class="auth-visual-overlay"></div>
      <div class="auth-visual-content">
        <h2>Join the Atelier</h2>
        <p>Create your account to start ordering, track your deliveries, and get personalized recommendations for your creative space.</p>
      </div>
    </div>
    <div class="auth-form-container">
      <div class="auth-form-wrapper">
        <a href="index.html" class="logo">Wood<span>o</span></a>
        <h1>Create Account</h1>
        <p class="subtitle">Fill in your details to get started</p>

        <form class="auth-form signup-form" novalidate>
          <div class="form-row">
            <div class="form-group">
              <label for="username">Full Name</label>
              <input type="text" id="username" name="username" class="form-input" placeholder="Your full name" required minlength="2" maxlength="50">
            </div>
            <div class="form-group">
              <label for="email">Email Address</label>
              <input type="email" id="email" name="email" class="form-input" placeholder="you@example.com" required>
            </div>
          </div>

          <div class="form-group">
            <label for="address">Delivery Address</label>
            <input type="text" id="address" name="address" class="form-input" placeholder="House, Road, Area, City" required minlength="5" maxlength="200">
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="phone">Phone Number</label>
              <input type="tel" id="phone" name="phone" class="form-input" placeholder="01XXXXXXXXX" required pattern="01[3-9][0-9]{8}" title="Enter a valid Bangladesh phone number: 01XXXXXXXXX">
            </div>
            <div class="form-group">
              <label for="whatsapp">WhatsApp Number</label>
              <input type="tel" id="whatsapp" name="whatsapp" class="form-input" placeholder="01XXXXXXXXX" required pattern="01[3-9][0-9]{8}" title="Enter a valid Bangladesh WhatsApp number: 01XXXXXXXXX">
            </div>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" class="form-input" placeholder="Min. 6 characters" required minlength="6">
          </div>

          <button type="submit" class="btn btn-primary btn-full btn-lg" style="margin-top:8px;">Create Account</button>
        </form>

        <div class="auth-footer">
          <p>Already have an account? <a href="login.html">Sign in</a></p>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
