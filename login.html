<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Woodo</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
</head>
<body data-page="login">

  <div class="auth-page">
    <div class="auth-visual">
      <img src="https://images.unsplash.com/photo-1558618666-fcd25c85f82e?w=800&h=1200&fit=crop" alt="Wood Texture">
      <div class="auth-visual-overlay"></div>
      <div class="auth-visual-content">
        <h2>Welcome Back</h2>
        <p>Sign in to access your dashboard, track orders, and continue your creative journey with Woodo.</p>
      </div>
    </div>
    <div class="auth-form-container">
      <div class="auth-form-wrapper">
        <a href="index.html" class="logo">Wood<span>o</span></a>
        <h1>Sign In</h1>
        <p class="subtitle">Enter your credentials to access your account</p>

        <form class="auth-form login-form">
          <div class="form-group">
            <label for="email">Email or Username</label>
            <input type="text" id="email" name="email" class="form-input" placeholder="you@example.com or username" required>
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" class="form-input" placeholder="Enter your password" required>
          </div>
          <button type="submit" class="btn btn-primary btn-full btn-lg" style="margin-top:8px;">Sign In</button>
        </form>

        <div class="auth-footer">
          <p>Don't have an account? <a href="signup.html">Create one</a></p>
          <p style="margin-top:12px; font-size:0.85rem; color:var(--text-muted);">
            Admin? Use your admin credentials to access the dashboard.
          </p>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
