<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop — Woodo</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
</head>
<body data-page="shop">

  <nav class="nav-glass">
    <div class="nav-inner">
      <a href="index.html" class="logo">Wood<span>o</span></a>
      <ul class="nav-links">
  <li><a href="index.html" data-nav="home">Home</a></li>
  <li><a href="shop.html" data-nav="shop">Shop</a></li>
  <li><a href="index.html#categories" data-nav="categories">Categories</a></li>
  <li><a href="index.html#story" data-nav="story">Our Story</a></li>
</ul>
      <div class="nav-actions">
        <div class="nav-user">
          <div class="nav-user-avatar"></div>
          <span class="nav-user-name"></span>
        </div>
        <a href="cart.html" class="nav-icon" title="Cart">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <path d="M16 10a4 4 0 0 1-8 0"></path>
          </svg>
          <span class="cart-count" style="display:none;">0</span>
        </a>
        <div class="nav-auth-links">
          <a href="login.html" class="btn btn-secondary btn-sm">Sign In</a>
          <a href="signup.html" class="btn btn-primary btn-sm">Get Started</a>
        </div>
        <div class="mobile-menu-btn"><span></span><span></span><span></span></div>
      </div>
    </div>
  </nav>

  <div class="shop-header">
    <div class="container">
      <h1>Our Collection</h1>
      <p>Handcrafted wooden art supplies, curated for creators who value quality and aesthetics.</p>
    </div>
  </div>

  <div class="shop-filters">
    <div class="container">
      <div class="filters-inner">
        <div class="filter-group">
          <select class="filter-select category-select">
            <option value="all">All Categories</option>
            <option value="canvas">Art Canvas</option>
            <option value="easel">Easel Canvas</option>
            <option value="tools">Colors & Tools</option>
            <option value="shelves">Wall Shelves</option>
          </select>
          <select class="filter-select">
            <option value="newest">Newest First</option>
            <option value="price-low">Price: Low to High</option>
            <option value="price-high">Price: High to Low</option>
          </select>
        </div>
        <div class="search-box">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.35-4.35"></path>
          </svg>
          <input type="text" class="search-input" placeholder="Search products...">
        </div>
      </div>
    </div>
  </div>

  <section class="shop-grid-section">
    <div class="container">
      <div class="products-grid">
        <div style="grid-column:1/-1; text-align:center; padding:60px;">
          <div class="spinner" style="margin:0 auto;"></div>
          <p style="margin-top:16px; color:var(--text-muted);">Loading products...</p>
        </div>
      </div>
    </div>
  </section>

  <footer class="footer" style="padding:40px 0;">
    <div class="container">
      <div class="footer-bottom" style="border:none; padding:0;">
        <p> Woodo Atelier. All rights reserved.</p>
        <p style="font-size:0.85rem; color:var(--text-muted);">Crafted with ♥ in Bangladesh</p>
      </div>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
